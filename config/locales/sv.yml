sv:
  text_gk_access_gui_stuff_missing: "GK GUI Stuff saknas. Sidorna, menyerna och API:t i GK Access är inte aktiva utan det. Skydd och spår gäller ändå."
  text_gk_access_gui_stuff_required: "Den installerade GK GUI Stuff är för gammal. %{version} eller senare krävs. Sidorna, menyerna och API:t i GK Access är inte aktiva utan det. Skydd och spår gäller ändå."
  text_gk_access_gui_stuff_inactive: "GK GUI Stuff är installerat i rätt version men är inte aktivt. Skälet står på dess egen inställningssida. Sidorna, menyerna och API:t i GK Access är inte aktiva förrän GK GUI Stuff är det. Skydd och spår gäller ändå."
  label_gk_access_gui_stuff_settings: "Inställningar för GK GUI Stuff"
  label_gk_access_about: "Om pluginet"
  text_gk_access_description: "Informationsnivåer med rang, ett tak per roll, och Privat som i Redmine eller strikt"
  text_gk_access_settings_where: "Pluginet har inga inställningar här. Nivåerna, rollernas tak och Privat ställs in under Administration, Nivåer, och ett projekts eget Privat under projektets inställningar."
  text_gk_access_uninstall: "När pluginet avinstalleras (migreras till version 0) tas dess tabeller bort. Tills Redmine har startats om utan pluginet når varje privat anteckning och privat ärende bara den som skrev det, eftersom tabellerna inte går att läsa. Därefter blir det som var strikt privat privat som i Redmine igen: Redmines egna regler avgör vem som ser det."
  label_gk_access_levels: "Nivåer"
  label_gk_access_level_new: "Ny nivå"
  label_gk_access_level_open: "Öppen"
  label_gk_access_level_internal: "Intern"
  label_gk_access_level_sensitive: "Känslig"
  text_gk_access_level_new_tip: "Lägg till en nivå med nyckel, rang och namn. Den hamnar i ordningen efter sin rang."
  text_gk_access_level_delete_tip: "Ta bort nivån. Bara en nivå som inget använder och som inte är ett förval kan tas bort, och borttagningen står i historiken."
  label_gk_access_key: "Nyckel"
  label_gk_access_rank: "Rang"
  field_gk_access_level_key: "Nyckel"
  field_gk_access_level_rank: "Rang"
  field_gk_access_role_level_level: "Tak"
  label_gk_access_closed: "Stängd för nya uppgifter"
  label_gk_access_open_for_new: "Används för nya uppgifter"
  label_gk_access_ceilings: "Tak per roll"
  label_gk_access_ceiling: "Tak"
  label_gk_access_private: "Privat"
  label_gk_access_private_kind: "Typ av Privat"
  label_gk_access_private_issues: "Privata ärenden"
  label_gk_access_private_notes: "Privata anteckningar"
  label_gk_access_private_core: "Privat som i Redmine"
  label_gk_access_private_strict: "Strikt privat"
  label_gk_access_appearance_private_hint: "Förklaringen vid Privat"
  text_gk_access_appearance_private_hint: "Vilken typ av Privat som gäller och vem som ser det: under en privat anteckning, på ett privat ärende och vid kryssrutorna Privat. Hel text: låset och texten under anteckningen och på ärendet. Bara ikon: bara låset, först i listen som fäller ihop anteckningen eller annars efter märket Privat, och ett tryck på låset visar texten. Vid kryssrutorna står låset i båda lägena. Av: förklaringen ritas inte och Redmines sida är orörd. Privat fungerar likadant med raden av."
  label_gk_access_appearance_private_hint_shape: "Visas som:"
  label_gk_access_appearance_private_hint_shape_full: "Hel text"
  label_gk_access_appearance_private_hint_shape_icon: "Bara ikon"
  label_gk_access_preview_hint: "Privat som i Redmine"
  text_gk_access_preview_hint: "den som skrev och den som får se privata anteckningar."
  text_gk_access_preview_hint_note: "Överst Bara ikon, under det Hel text. Förklaringen är påhittad."
  label_gk_access_private_instance: "Hela instansen"
  label_gk_access_private_projects: "Projekt som valt strikt själva"
  label_gk_access_losing: "De här tappar åtkomst till dem om strikt väljs:"
  label_gk_access_event_level: "Nivå ändrad"
  label_gk_access_event_role_level: "Rollens tak ändrat"
  label_gk_access_event_private_mode: "Typen av Privat ändrad"
  label_gk_access_event_private: "Privat ändrat"
  label_gk_access_event_strict_removed: "Strikt privat borttaget med ett konto"
  label_gk_access_private_counts: "Strikt privat per projekt"
  notice_gk_access_strict_exists: "Ärendet finns men är strikt privat. Bara den som skrev det kan se det."
  text_gk_access_user_strict_removed: "%{name} har strikt privata poster (ärenden: %{issues}, anteckningar: %{notes}; %{tokens}). De tas bort tillsammans med kontot och kan inte återställas, eftersom ingen annan får se dem. Bara deras anonyma identiteter visas och loggas."
  text_gk_access_strict_anonymous: "Strikt privat %{token}"
  text_gk_access_private_marked_stays: "Det som redan är strikt privat förblir strikt privat. Ett byte tillbaka till som i Redmine gäller bara det som blir privat efter bytet."
  text_gk_access_private_no_counts: "Inget är strikt privat."
  permission_manage_gk_access_private: "Hantera Privat"
  permission_gk_access_api_read: "Läsa nivåer, tak och typen av Privat (API-omfång)"
  permission_gk_access_api_manage: "Ändra nivåer, tak och typen av Privat (API-omfång)"
  text_gk_access_levels_info: "En nivå med högre rang är mer begränsad, och den som ser en nivå ser alla med lägre rang. En nivå som används tas aldrig bort; den stängs för nya uppgifter."
  text_gk_access_ceilings_info: "Rollens tak är den högsta nivå rollen ser. Utan tak ser rollen bara den lägsta nivån. Administratören ser alla nivåer med rang."
  text_gk_access_private_info: "Privata ärenden och privata anteckningar fungerar som i Redmine om inte strikt är valt. Valet görs för ärenden och anteckningar var för sig, här för hela instansen, och ett projekt kan välja strikt för sig under Inställningar > Privat. Det som blir privat där strikt gäller förblir strikt privat, också om valet ändras tillbaka. Ett konto som tas bort tar sitt strikt privata med sig. Med raden Förklaringen vid Privat på, under Utseende, ser användaren vid rutan Privat vilken typ som gäller och vem som ser det. Den som har databasen kan alltid läsa tekniskt."
  text_gk_access_private_core_issues: "Som i Redmine: ett privat ärende ses av den som skrev det, den det är tilldelat (också en grupp), roller som ser alla ärenden och administratörer."
  text_gk_access_private_strict_issues: "Strikt: ett privat ärende ses bara av den som skrev det. Det kan bara tilldelas den som skrev det, och bara den som skrev det gör det privat eller inte."
  text_gk_access_private_core_notes: "Som i Redmine: en privat anteckning ses av den som skrev den, roller med Visa privata anteckningar och administratörer."
  text_gk_access_private_strict_notes: "Strikt: en privat anteckning ses bara av den som skrev den och går inte ut med e-post. En anteckning med ändringar eller bilagor kan inte göras privat i efterhand."
  text_gk_access_private_forced: "Hela instansen har strikt, så det gäller här också."
  text_gk_access_private_admin_loosens: "Bara en administratör kan ändra tillbaka till som i Redmine."
  text_gk_access_private_project_info: "Projektet kan välja strikt privat för sig, för ärenden och anteckningar var för sig. Det blir aldrig mindre strikt än hela instansen. Ändringen står i historiken."
  text_gk_access_private_no_projects: "Inga projekt har valt strikt själva."
  text_gk_access_private_save_confirm: "Det som blir strikt privat ses sedan bara av den som skrev det. Spara?"
  text_gk_access_inventory: "Om strikt väljs där det inte redan gäller blir de här strikt privata: privata anteckningar %{notes}, privata ärenden %{issues}."
  text_gk_access_losing_view_private_notes: "Rollen %{name} (Visa privata anteckningar)"
  text_gk_access_losing_issues_all: "Rollen %{name} (ser alla ärenden)"
  text_gk_access_losing_assigned:
    one: "%{name}, tilldelad 1 privat ärende"
    other: "%{name}, tilldelad %{count} privata ärenden"
  text_gk_access_losing_watchers:
    one: "1 bevakare av privata ärenden"
    other: "%{count} bevakare av privata ärenden"
  text_gk_access_losing_admins:
    one: "1 administratör"
    other: "%{count} administratörer"
  text_gk_access_explain_issues_core: "ett privat ärende här ses av %{who}."
  text_gk_access_explain_issues_strict: "ett privat ärende här ses bara av den som skrev det (%{writer}). Ingen annan ser det, inte heller den det tilldelas, rollerna eller administratörer."
  text_gk_access_explain_notes_core: "en privat anteckning här ses av %{who}."
  text_gk_access_explain_notes_strict: "en privat anteckning här ses bara av den som skrev den (%{writer}). Ingen annan ser den, inte heller roller med Visa privata anteckningar eller administratörer, och den går inte ut med e-post."
  text_gk_access_who_wrote: "den som skrev (%{name})"
  text_gk_access_who_you: "du"
  text_gk_access_who_writer: "den som skriver"
  text_gk_access_who_assigned: "den tilldelade (%{name})"
  text_gk_access_who_assignee: "den det tilldelas"
  text_gk_access_who_roles_issues: "den som har rollen %{roles} (ser alla ärenden)"
  text_gk_access_who_roles_notes: "den som har rollen %{roles} (Visa privata anteckningar)"
  text_gk_access_who_admins: "administratörer"
  text_gk_access_and: "och"
  text_gk_access_key_info: "Små bokstäver, siffror och understreck. Nyckeln ändras inte efteråt."
  text_gk_access_rank_info: "Ett heltal; högre är mer begränsat. Förvalen har 0, 100 och 200, så det finns plats för nivåer mellan och över."
  text_gk_access_default_name: "Tomt namn ger %{name}."
  text_gk_access_closed_info: "En stängd nivå står kvar där den används men kan inte väljas för nya uppgifter."
  text_gk_access_nothing_changed: "Inget ändrades."
  error_gk_access_records: "GK Records saknas, och GK Access kräver det: nivåer, tak och Privat går inte att ändra förrän det finns, eftersom varje ändring står i historiken."
  error_gk_access_scenario_level: "Scenariot anger nivån %{level}, som inte finns."
  error_gk_access_level_in_use: "Nivån används och kan inte tas bort. Stäng den i stället."
  error_gk_access_level_default: "Nivån är ett förval och kan inte tas bort. Stäng den i stället."
  error_gk_access_loosen_admin_only: "Bara en administratör kan göra ett projekt mindre strikt."
  error_gk_access_user_strict_admin_only: "Kontot har strikt privata poster som tas bort med det, och bara en administratör får ta bort något på riktigt. Be en administratör ta bort kontot."
  error_gk_access_user_strict_held: "%{name} har strikt privata poster i projekt med bevarandebeslut (%{projects}). De får inte tas bort medan beslutet gäller, så kontot kan låsas men inte tas bort."
  error_gk_access_api_ceiling: "Rollen %{role} eller nivån %{level} finns inte; inget tak ändrades."
  error_gk_access_api_private_kind: "Typen av Privat anges som `strict` eller `core`."
  error_gk_access_private_unreadable: "Privat går inte att läsa just nu."
  error_gk_access_api_level_body: "Nivån anges som { \"level\": { ... } }."
  activerecord:
    errors:
      messages:
        gk_access_owner_only: "kan bara ändras av skaparen"
        gk_access_private_assigned: "kan inte vara någon annan än den som skapade ärendet, eftersom ärendet är strikt privat"
        gk_access_private_with_details: "kan inte sättas i efterhand på en anteckning med ändringar eller bilagor"
