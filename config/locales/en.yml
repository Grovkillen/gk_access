en:
  text_gk_access_gui_stuff_missing: "GK GUI Stuff is missing. The pages, menus and API of GK Access are not active without it. Protection and traces hold all the same."
  text_gk_access_gui_stuff_required: "The installed GK GUI Stuff is too old. %{version} or later is required. The pages, menus and API of GK Access are not active without it. Protection and traces hold all the same."
  text_gk_access_gui_stuff_inactive: "GK GUI Stuff is installed in the right version but is not active. Its own settings page says why. The pages, menus and API of GK Access are not active until GK GUI Stuff is. Protection and traces hold all the same."
  label_gk_access_gui_stuff_settings: "GK GUI Stuff settings"
  label_gk_access_about: "About the plugin"
  text_gk_access_description: "Information levels with a rank, a ceiling per role, and Private as in Redmine or strict"
  text_gk_access_settings_where: "The plugin has no settings here. The levels, the roles' ceilings and Private are set under Administration, Levels, and a project's own Private under the project's settings."
  text_gk_access_uninstall: "When the plugin is uninstalled (migrated to version 0) its tables are removed. Until Redmine is restarted without the plugin, every private note and private issue reaches only the one who wrote it, since the tables cannot be read. After that, what was strictly private is private as in Redmine again: Redmine's own rules decide who sees it."
  label_gk_access_levels: "Levels"
  label_gk_access_level_new: "New level"
  label_gk_access_level_open: "Open"
  label_gk_access_level_internal: "Internal"
  label_gk_access_level_sensitive: "Sensitive"
  text_gk_access_level_new_tip: "Add a level with a key, a rank and a name. It takes its place in the order by its rank."
  text_gk_access_level_delete_tip: "Remove the level. Only a level that nothing uses and that is not a default can be removed, and the removal is kept in the history."
  label_gk_access_key: "Key"
  label_gk_access_rank: "Rank"
  field_gk_access_level_key: "Key"
  field_gk_access_level_rank: "Rank"
  field_gk_access_role_level_level: "Ceiling"
  label_gk_access_closed: "Closed for new things"
  label_gk_access_open_for_new: "Used for new things"
  label_gk_access_ceilings: "Ceiling per role"
  label_gk_access_ceiling: "Ceiling"
  label_gk_access_private: "Private"
  label_gk_access_private_kind: "Kind of Private"
  label_gk_access_private_issues: "Private issues"
  label_gk_access_private_notes: "Private notes"
  label_gk_access_private_core: "Private as in Redmine"
  label_gk_access_private_strict: "Strictly private"
  label_gk_access_appearance_private_hint: "The explanation by Private"
  text_gk_access_appearance_private_hint: "Which kind of Private holds and who sees it: under a private note, on a private issue and by the check boxes Private. Full text: the lock and the text under the note and on the issue. Icon only: the lock alone, first on the bar that folds the note or else after the mark Private, and a press on the lock shows the text. By the check boxes the lock stands in both. Off: the explanation is not drawn and Redmine's page is untouched. Private works the same with the row off."
  label_gk_access_appearance_private_hint_shape: "Shown as:"
  label_gk_access_appearance_private_hint_shape_full: "Full text"
  label_gk_access_appearance_private_hint_shape_icon: "Icon only"
  label_gk_access_preview_hint: "Private as in Redmine"
  text_gk_access_preview_hint: "the writer and those who may see private notes."
  text_gk_access_preview_hint_note: "First Icon only, under it Full text. The explanation is made up."
  label_gk_access_private_instance: "The whole instance"
  label_gk_access_private_projects: "Projects that chose strict themselves"
  label_gk_access_losing: "These lose access to them if strict is chosen:"
  label_gk_access_event_level: "Level changed"
  label_gk_access_event_role_level: "Role's ceiling changed"
  label_gk_access_event_private_mode: "Kind of Private changed"
  label_gk_access_event_private: "Private changed"
  label_gk_access_event_strict_removed: "Strictly private removed with an account"
  label_gk_access_private_counts: "Strictly private per project"
  notice_gk_access_strict_exists: "The issue exists but is strictly private. Only the one who wrote it can see it."
  text_gk_access_user_strict_removed: "%{name} has strictly private things (issues: %{issues}, notes: %{notes}; %{tokens}). They are removed together with the account and cannot be restored, since no one else may see them. Only their anonymous identities are shown and logged."
  text_gk_access_strict_anonymous: "Strictly private %{token}"
  text_gk_access_private_marked_stays: "What is strictly private already stays strictly private. A change back to as in Redmine holds only for what becomes private after the change."
  text_gk_access_private_no_counts: "Nothing is strictly private."
  permission_manage_gk_access_private: "Manage Private"
  permission_gk_access_api_read: "Read levels, ceilings and the kind of Private (API scope)"
  permission_gk_access_api_manage: "Change levels, ceilings and the kind of Private (API scope)"
  text_gk_access_levels_info: "A level with a higher rank is more restricted, and whoever sees a level sees every level with a lower rank. A level in use is never removed; it is closed for new things."
  text_gk_access_ceilings_info: "A role's ceiling is the highest level the role sees. Without a ceiling the role sees the lowest level only. The administrator sees every level with a rank."
  text_gk_access_private_info: "Private issues and private notes work as in Redmine unless strict is chosen. The choice is made for issues and notes each, here for the whole instance, and a project can choose strict for itself under Settings > Private. What becomes private where strict holds stays strictly private, also when the choice is changed back. An account that is deleted takes what it holds strictly private with it. With the row The explanation by Private on, under Appearance, the user sees by the check box Private which kind holds and who sees it. Whoever has the database can always read it technically."
  text_gk_access_private_core_issues: "As in Redmine: a private issue is seen by the one who wrote it, the one it is assigned to (a group too), roles that see all issues and administrators."
  text_gk_access_private_strict_issues: "Strict: a private issue is seen only by the one who wrote it. It can be assigned only to the one who wrote it, and only the one who wrote it makes it private or not."
  text_gk_access_private_core_notes: "As in Redmine: a private note is seen by the one who wrote it, roles with View private notes and administrators."
  text_gk_access_private_strict_notes: "Strict: a private note is seen only by the one who wrote it and is not sent by mail. A note with changes or attachments cannot be made private afterwards."
  text_gk_access_private_forced: "The whole instance has strict, so it holds here too."
  text_gk_access_private_admin_loosens: "Only an administrator can change it back to as in Redmine."
  text_gk_access_private_project_info: "The project can choose strictly private for itself, for issues and notes each. It is never less strict than the whole instance. The change is kept in the history."
  text_gk_access_private_no_projects: "No project has chosen strict itself."
  text_gk_access_private_save_confirm: "What becomes strictly private is then seen only by the one who wrote it. Save?"
  text_gk_access_inventory: "If strict is chosen where it does not hold yet, these become strictly private: private notes %{notes}, private issues %{issues}."
  text_gk_access_losing_view_private_notes: "The role %{name} (View private notes)"
  text_gk_access_losing_issues_all: "The role %{name} (sees all issues)"
  text_gk_access_losing_assigned:
    one: "%{name}, assigned 1 private issue"
    other: "%{name}, assigned %{count} private issues"
  text_gk_access_losing_watchers:
    one: "1 watcher of private issues"
    other: "%{count} watchers of private issues"
  text_gk_access_losing_admins:
    one: "1 administrator"
    other: "%{count} administrators"
  text_gk_access_explain_issues_core: "a private issue here is seen by %{who}."
  text_gk_access_explain_issues_strict: "a private issue here is seen only by the one who wrote it (%{writer}). No one else sees it, not the one it is assigned to, the roles or administrators."
  text_gk_access_explain_notes_core: "a private note here is seen by %{who}."
  text_gk_access_explain_notes_strict: "a private note here is seen only by the one who wrote it (%{writer}). No one else sees it, not roles with View private notes or administrators, and it is not sent by mail."
  text_gk_access_who_wrote: "the one who wrote it (%{name})"
  text_gk_access_who_you: "you"
  text_gk_access_who_writer: "the one who writes it"
  text_gk_access_who_assigned: "the assignee (%{name})"
  text_gk_access_who_assignee: "the one it is assigned to"
  text_gk_access_who_roles_issues: "whoever has the role %{roles} (sees all issues)"
  text_gk_access_who_roles_notes: "whoever has the role %{roles} (View private notes)"
  text_gk_access_who_admins: "administrators"
  text_gk_access_and: "and"
  text_gk_access_key_info: "Small letters, digits and underscores. The key is not changed afterwards."
  text_gk_access_rank_info: "A whole number; higher is more restricted. The defaults have 0, 100 and 200, so there is room for levels between and above."
  text_gk_access_default_name: "An empty name gives %{name}."
  text_gk_access_closed_info: "A closed level stays where it is used but cannot be chosen for new things."
  text_gk_access_nothing_changed: "Nothing was changed."
  error_gk_access_records: "GK Records is missing, and GK Access requires it: levels, ceilings and Private cannot be changed until it is there, since every change is kept in the history."
  error_gk_access_scenario_level: "The scenario names the level %{level}, which does not exist."
  error_gk_access_level_in_use: "The level is in use and cannot be removed. Close it instead."
  error_gk_access_level_default: "The level is a default and cannot be removed. Close it instead."
  error_gk_access_loosen_admin_only: "Only an administrator can make a project less strict."
  error_gk_access_user_strict_admin_only: "The account has strictly private things that are removed with it, and only an administrator may remove anything for good. Ask an administrator to delete the account."
  error_gk_access_user_strict_held: "%{name} has strictly private things in projects with a preservation hold (%{projects}). They may not be removed while the hold lasts, so the account can be locked but not deleted."
  error_gk_access_api_ceiling: "The role %{role} or the level %{level} does not exist; no ceiling was changed."
  error_gk_access_api_private_kind: "The kind of Private is given as `strict` or `core`."
  error_gk_access_private_unreadable: "Private cannot be read right now."
  error_gk_access_api_level_body: "The level is given as { \"level\": { ... } }."
  activerecord:
    errors:
      messages:
        gk_access_owner_only: "can only be changed by the author"
        gk_access_private_assigned: "cannot be anyone but the issue's author, since the issue is strictly private"
        gk_access_private_with_details: "cannot be set afterwards on a note with changes or attachments"
